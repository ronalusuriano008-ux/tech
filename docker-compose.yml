# =====================================================
# DOCKER COMPOSE - Orquestación de contenedores
# =====================================================

version: '3.8'

services:
  # Servicio principal de aplicación
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taller-tech-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - API_BASE_URL=${API_BASE_URL:-/api}
      - APP_BASE_URL=${APP_BASE_URL:-}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:3000}
      - SESSION_SECRET=${SESSION_SECRET:-cambiar-en-produccion}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/temp:/app/backend/temp
      - ./backend/public:/app/backend/public
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - taller-tech-network

networks:
  taller-tech-network:
    driver: bridge
