<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Taller Tech</title>
    <meta name="theme-color" content="#0f172a">
    <meta name="application-name" content="Taller Tech">
    <meta name="apple-mobile-web-app-title" content="Taller Tech">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <!-- Pico CSS para estructura responsiva automatica -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <!-- Iconos futuristas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/login/style.css">
    <link rel="stylesheet" href="/css/app-theme.css">
    <link rel="stylesheet" href="/css/messages.css">
</head>
<body>
    <main class="container">
        <article class="card-futurist">
            <header class="text-center">
                <hgroup>
                    <h1><i class="bi bi-cpu-fill"></i> TALLER TECH</h1>
                    <p>Sistema de Gestión de Servicios</p>
                </hgroup>
            </header>
            <form id="loginForm">
                <div class="input-group">
                    <i class="bi bi-person-fill"></i>
                    <input type="text" id="usuario" placeholder="Usuario" required autocomplete="username">
                </div>
                <div class="input-group">
                    <i class="bi bi-lock-fill"></i>
                    <input type="password" id="password" placeholder="Contraseña" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-futurist">
                    <i class="bi bi-box-arrow-in-right"></i> Ingresar
                </button>
                <p id="error" class="error-msg" style="display:none;">Credenciales incorrectas</p>
            </form>
        </article>
    </main>
    <script src="/js/config.js"></script>
    <script src="/js/pwa-register.js"></script>
    <script src="/js/messages.js"></script>
    <script src="/login/app.js"></script>
</body>
</html>
