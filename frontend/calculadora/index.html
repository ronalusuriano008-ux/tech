<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Precios</title>
    <!-- Pico CSS para estructura responsiva automatica -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <!-- Iconos futuristas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <header class="text-center header-title">
            <hgroup>
                <h1><i class="bi bi-calculator"></i> Calculadora</h1>
                <p>Cálculo dinámico de precios</p>
            </hgroup>
        </header>

        <!-- Pantalla de configuración estilo Terminal -->
        <div class="config-strip" id="configDisplay">
            Cargando configuración...
        </div>

        <!-- Formulario de Inputs -->
        <article class="card-futurist">
            <form id="calcForm" class="calc-grid">
                <div class="form-group">
                    <label for="cr"><i class="bi bi-cash-stack"></i> Costo Repuesto</label>
                    <input type="number" step="0.1" id="cr" value="" oninput="calculate()">
                </div>
                <div class="form-group">
                    <label for="tiempo"><i class="bi bi-clock-history"></i> Tiempo (Horas)</label>
                    <input type="number" step="0.1" id="tiempo" value="" oninput="calculate()">
                </div>
                <div class="form-group">
                    <label for="trabajos"><i class="bi bi-list-check"></i> Trabajos del día</label>
                    <input type="number" id="trabajos" value="1" oninput="calculate()">
                </div>
                
                <div class="checkbox-wrapper">
                    <label for="stock"><i class="bi bi-box-seam"></i> ¿Hay Stock?</label>
                    <input type="checkbox" id="stock" role="switch" onchange="calculate()">
                </div>
            </form>
        </article>

        <!-- Pantalla de Resultados -->
        <article class="card-futurist result-card">
            <div class="result-details">
                <small>Costo Base</small>
                <span id="costoBase" class="text-sub">$0</span>
            </div>
            <div class="divider"></div>
            <div class="result-main">
                <small>Precio Sugerido</small>
                <h2 id="precioFinal" class="neon-glow-text">$0.0</h2>
            </div>
        </article>

        <!-- Navegación Inferior -->
        <nav class="nav-bottom">
            <a href="/registro/index.html" class="btn-futurist btn-outline">
                <i class="bi bi-arrow-left-circle"></i> Ir a Servicios
            </a>
            <button onclick="logout()" class="btn-nav danger">
                <i class="bi bi-box-arrow-left"></i> Salir
            </button>
        </nav>
    </main>
    <script src="app.js"></script>
</body>
</html>
