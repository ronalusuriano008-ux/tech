
<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Taller Tech</title>
    <meta name="theme-color" content="#0f172a">
    <meta name="application-name" content="Taller Tech">
    <meta name="apple-mobile-web-app-title" content="Taller Tech">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/shared/manifest.json">
    <link rel="icon" href="/shared/icons/taller-tech-icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/shared/icons/taller-tech-icon.svg" type="image/svg+xml">
    <!-- Pico CSS para estructura responsiva automatica -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <!-- Iconos futuristas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/modules/authentication/style.css">
    <link rel="stylesheet" href="/shared/css/app-theme.css">
    <link rel="stylesheet" href="/shared/css/messages.css">
    <link rel="stylesheet" href="/shared/css/offline-status.css">
    <link rel="stylesheet" href="/shared/css/glass-theme.css">
</head>
<body>
    <main class="container">
        <article class="card-futurist login-card">
            <header class="login-header">
               <img class="login-logo" src="/shared/icons/taller-tech-logo.svg" alt="Taller Tech">
                <span class="login-eyebrow">Gestión del taller</span>
                <h1>Iniciar sesión</h1>
            </header>
            <form id="loginForm">
                <div class="input-group">
                    <i class="bi bi-person-fill"></i>
                    <label class="visually-hidden" for="usuario">Usuario</label>
                    <input type="text" id="usuario" placeholder="Usuario" required autocomplete="username" autocapitalize="none" spellcheck="false">
                </div>
                <div class="input-group">
                    <i class="bi bi-lock-fill"></i>
                    <label class="visually-hidden" for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Contraseña" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-futurist">
                    <i class="bi bi-box-arrow-in-right"></i> Ingresar
                </button>
                <p id="error" class="error-msg" role="alert" aria-live="polite" style="display:none;">Credenciales incorrectas</p>
            </form>
            <footer class="login-footer">Taller Tech <span aria-hidden="true">·</span> v<span id="appVersion">—</span></footer>
        </article>
    </main>
    <script src="/shared/js/config.js"></script>
    <script src="/shared/js/data/offline-store.js"></script>
    <script src="/shared/js/data/data-service.js"></script>
    <script src="/shared/js/request-cache.js"></script>
    <script src="/shared/js/offline-status.js"></script>
    <script src="/shared/js/pwa-register.js"></script>
    <script src="/shared/js/messages.js"></script>
    <script src="/modules/authentication/app.js"></script>
</body>
</html>
