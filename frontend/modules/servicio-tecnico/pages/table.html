<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tabla - Diario (solo lectura)</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.4/css/all.min.css">
  <link rel="stylesheet" href="/shared/css/shared-theme.css">
  <link rel="stylesheet" href="/shared/css/messages.css">
  <link rel="stylesheet" href="/shared/css/offline-status.css">
  <link rel="stylesheet" href="/shared/css/glass-theme.css">
</head>
<body class="app-body">
  <div class="app-shell">
    <aside class="app-sidebar">
      <div class="app-sidebar__brand">
        <img src="/shared/icons/taller-tech-logo.svg" alt="Taller Tech" width="220" height="50" style="display:block;max-width:100%;height:auto;">
      </div>
      <div class="app-sidebar__user" id="shellUserInfo"></div>
      <nav class="app-sidebar__nav" id="appSidebarNav"></nav>
      <div class="app-sidebar__footer">
        <button id="appLogoutBtn" class="app-button app-button-ghost app-button-block">
          <i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión
        </button>
      </div>
    </aside>

    <div class="app-content">
      <header class="app-topbar">
        <div>
          <p class="app-topbar__eyebrow">Consulta</p>
          <h1>Tabla del diario</h1>
        </div>
        <div class="app-topbar__actions">
          <span id="userInfo" class="app-badge"></span>
          <label class="app-picker">
            <i class="fa-solid fa-calendar-days"></i>
            <input type="month" id="monthPicker">
          </label>
          <button id="backupJsonBtn" class="app-button app-button-fill"><i class="fas fa-download"></i> Backup JSON</button>
        </div>
      </header>

      <main class="app-main">
        <div class="table-responsive shadow-sm">
          <table id="mainTable" class="table table-bordered table-hover align-middle mb-0">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <div id="toast" class="app-toast"></div>

  <script src="/shared/js/config.js"></script>
  <script src="/shared/js/data/offline-store.js"></script>
  <script src="/shared/js/data/data-service.js"></script>
  <script src="/shared/js/request-cache.js"></script>
  <script src="/shared/js/offline-status.js"></script>
  <script src="/shared/js/pwa-register.js"></script>
  <script src="/shared/js/app-shell.js"></script>
  <script src="/shared/js/messages.js"></script>
  <script type="module" src="/modules/servicio-tecnico/js/tableView.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
