<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Control Diario de Tiendas</title>
  <link rel="stylesheet" href="/shared/css/styles.css" />
  <link rel="stylesheet" href="/shared/css/app-theme.css" />
  <link rel="stylesheet" href="/shared/css/tienda.css" />
  <link rel="stylesheet" href="/shared/css/offline-status.css" />
  <link rel="manifest" href="/shared/manifest.json" />
  <style>
    :root {
      --bg-deep: #020617;
      --bg-panel: rgba(15, 23, 42, 0.96);
      --bg-surface: rgba(30, 41, 59, 0.9);
      --border-soft: rgba(148, 163, 184, 0.22);
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-green: #22c55e;
      --accent-gold: #fbbf24;
      --accent-violet: #a78bfa;
      --accent-red: #ef4444;
      --shadow-soft: 0 18px 40px rgba(2, 6, 23, 0.38);
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      background: radial-gradient(circle at top left, #0f172a 0%, #020617 58%, #01040a 100%);
      color: var(--text-main);
    }

    .app-header {
      background: linear-gradient(190deg, #020617 0%, #0f172a 42%, #1d4ed8 100%);
      border-bottom: 1px solid rgba(148, 163, 184, 0.18);
      box-shadow: inset 0 -1px 0 rgba(255,255,255,0.06);
      padding: 18px 0 16px;
    }

    .container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 0 18px;
    }

    .app-header .container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
    }

    .app-header img {
      width: min(250px, 70vw);
      height: auto;
      display: block;
      filter: drop-shadow(0 10px 18px rgba(59, 130, 246, 0.26));
    }

    .app-header h1 {
      margin: 0;
      font-size: clamp(1.2rem, 2vw, 2rem);
      font-weight: 800;
      color: #f8fafc;
      letter-spacing: 0.02em;
    }

    main.container {
      padding-top: 18px;
      padding-bottom: 32px;
    }

    .panel {
      background: linear-gradient(180deg, rgba(15,23,42,0.96), rgba(15,23,42,0.9));
      border: 1px solid var(--border-soft);
      border-radius: 18px;
      box-shadow: var(--shadow-soft);
      overflow: hidden;
      margin-bottom: 18px;
    }

    .controls-bar {
      display: flex;
      align-items: end;
      justify-content: flex-start;
      gap: 12px;
      flex-wrap: wrap;
      padding: 18px 18px 8px;
      background: rgba(15, 23, 42, 0.7);
      border-bottom: 1px solid var(--border-soft);
    }

    .form-group.inline {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 120px;
    }

    .form-group label,
    .controls-bar label {
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .form-control,
    select,
    input,
    textarea {
      border-radius: 10px !important;
      border: 1px solid rgba(148,163,184,0.24) !important;
      background: rgba(15, 23, 42, 0.9) !important;
      color: #f8fafc !important;
      padding: 9px 12px !important;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-control:focus,
    select:focus,
    input:focus,
    textarea:focus {
      border-color: rgba(56, 189, 248, 0.9) !important;
      box-shadow: 0 0 0 3px rgba(56,189,248,0.18) !important;
      outline: none !important;
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 700;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn-success {
      background: linear-gradient(180deg, #22c55e, #16a34a);
      color: white;
      box-shadow: 0 8px 18px rgba(34, 197, 94, 0.2);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #f8fafc;
      border: 1px solid rgba(148,163,184,0.2);
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(170px, 1fr));
      gap: 14px;
      padding: 18px;
      background: rgba(15,23,42,0.45);
    }

    .summary-card {
      position: relative;
      overflow: hidden;
      padding: 18px 16px;
      background: linear-gradient(145deg, rgba(30,41,59,0.96), rgba(15,23,42,0.96));
      border: 1px solid var(--border-soft);
      border-radius: 16px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
    }

    .summary-card::after {
      content: "";
      position: absolute;
      right: -18px;
      bottom: -18px;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.08);
    }

    .summary-card span {
      display: block;
      font-size: 0.73rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .summary-card strong {
      display: block;
      font-size: clamp(1rem, 1.6vw, 1.5rem);
      font-weight: 800;
      color: #f8fafc;
    }

    .table-responsive {
      padding: 0 18px 18px;
    }

    .table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 16px;
      background: rgba(15,23,42,0.96);
      border: 1px solid rgba(148,163,184,0.18);
      font-size: 0.82rem;
    }

    .table th,
    .table td {
      border: 1px solid rgba(148,163,184,0.14);
      padding: 10px 8px;
      text-align: center;
      color: #f8fafc;
      background: rgba(15,23,42,0.9);
    }

    .table th {
      background: rgba(30,41,59,0.95);
      color: #cbd5e1;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .table tbody tr:hover td {
      background: rgba(30, 41, 59, 0.9);
    }

    .money-positive { color: #4ade80; font-weight: 700; }
    .money-negative { color: #fca5a5; font-weight: 700; }

    .withdrawal-panel {
      background: linear-gradient(180deg, rgba(15,23,42,0.96), rgba(15,23,42,0.9));
      border: 1px solid var(--border-soft);
      border-radius: 18px;
      box-shadow: var(--shadow-soft);
      margin-bottom: 18px;
      padding: 18px;
    }

    .withdrawal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .withdrawal-header h3 {
      margin: 0;
      color: #f8fafc;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .withdrawal-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .withdrawal-item {
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-left: 4px solid #f87171;
      border-radius: 12px;
      padding: 12px 14px;
      color: #e2e8f0;
      line-height: 1.5;
    }

    .withdrawal-date {
      display: inline-block;
      margin-right: 6px;
      color: #fca5a5;
      font-weight: 800;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: rgba(2, 6, 23, 0.7);
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .modal-content {
      width: min(680px, 92vw);
      max-height: 82vh;
      overflow-y: auto;
      background: rgba(15, 23, 42, 0.98);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(2, 6, 23, 0.5);
    }

    .modal-body {
      padding: 10px 18px 18px;
    }

    .modal-body form {
      display: grid;
      grid-template-columns: repeat(2, minmax(220px, 1fr));
      gap: 12px 18px;
    }

    .modal-body .form-group {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .modal-body .form-group:last-of-type,
    .modal-body .form-group:nth-last-child(2) {
      grid-column: 1 / -1;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px 10px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.14);
    }

    .modal-header h2 {
      margin: 0;
      font-size: 1.2rem;
    }

    .close-btn {
      font-size: 1.7rem;
      cursor: pointer;
      color: #cbd5e1;
      line-height: 1;
    }

    .form-actions {
      grid-column: 1 / -1;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 8px;
    }

    .status-message {
      min-height: 22px;
      padding: 0 18px 16px;
      font-size: 0.85rem;
      color: #cbd5e1;
    }

    .status-success { color: #86efac; }
    .status-error { color: #fca5a5; }

    @media (max-width: 768px) {
      .controls-bar {
        align-items: stretch;
      }

      .summary-grid {
        grid-template-columns: 1fr;
      }

      .table {
        min-width: 760px;
      }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="container">
      <img src="/shared/icons/taller-tech-logo.svg" alt="Taller Tech" />
      <h1>Control Diario de Tiendas</h1>
    </div>
  </header>
  <main class="container">
    <section class="panel">
      <div class="controls-bar">
        <div class="form-group inline">
          <label for="year">Año</label>
          <input type="number" id="year" class="form-control" min="2000" max="2100" />
        </div>
        <div class="form-group inline">
          <label for="month">Mes</label>
          <select id="month" class="form-control">
            <option value="1">Enero</option>
            <option value="2">Febrero</option>
            <option value="3">Marzo</option>
            <option value="4">Abril</option>
            <option value="5">Mayo</option>
            <option value="6">Junio</option>
            <option value="7">Julio</option>
            <option value="8">Agosto</option>
            <option value="9">Septiembre</option>
            <option value="10">Octubre</option>
            <option value="11">Noviembre</option>
            <option value="12">Diciembre</option>
          </select>
        </div>
        <button id="btnNewDay" class="btn btn-success">Nuevo día</button>
        <button id="btnGeneratePdf" class="btn btn-secondary">Descargar PDF</button>
      </div>
      <div id="statusMessage" class="status-message"></div>
    </section>

    <section class="panel">
      <div id="summaryContent" class="summary-grid">
        <div class="summary-card">
          <span>Total Mes</span>
          <strong id="summaryTotal">S/. 0.00</strong>
        </div>
        <div class="summary-card">
          <span>Saldo Tienda</span>
          <strong id="summaryAcumulado">S/. 0.00</strong>
        </div>
        <div class="summary-card">
          <span>Saldo Banco</span>
          <strong id="summarySaldoBanco">S/. 0.00</strong>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="table-responsive">
        <table class="table">
          <thead>
            <tr>
              <th>Día</th>
              <th>Tienda 1</th>
              <th>Tienda 2</th>
              <th>Tienda 3</th>
              <th>Total Diario</th>
              <th>Banco Depositado</th>
              <th>Retiro Tienda</th>
              <th>Retiro Banco</th>
              <th>Saldo Banco</th>
              <th>Acumulado Tienda</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tiendaTableBody"></tbody>
        </table>
      </div>
    </section>

    <section class="withdrawal-panel">
      <div class="withdrawal-header">
        <h3>Historial de retiros</h3>
      </div>
      <div id="withdrawalNotesContainer" class="withdrawal-list"></div>
    </section>
  </main>

  <div id="dayModal" class="modal" style="display:none;">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Registrar Día</h2>
        <span id="closeModal" class="close-btn">×</span>
      </div>
      <div class="modal-body">
        <form id="dayForm">
          <div class="form-group">
            <label for="day">Día</label>
            <input type="number" id="day" class="form-control" min="1" max="31" placeholder="Ej. 15" required />
          </div>
          <div class="form-group">
            <label for="tienda1">Tienda 1</label>
            <input type="number" step="0.01" inputmode="decimal" id="tienda1" class="form-control" value="" min="0" placeholder="0.00" />
          </div>
          <div class="form-group">
            <label for="tienda2">Tienda 2</label>
            <input type="number" step="0.01" inputmode="decimal" id="tienda2" class="form-control" value="" min="0" placeholder="0.00" />
          </div>
          <div class="form-group">
            <label for="tienda3">Tienda 3</label>
            <input type="number" step="0.01" inputmode="decimal" id="tienda3" class="form-control" value="" min="0" placeholder="0.00" />
          </div>
          <div class="form-group">
            <label for="bancoDepositado">Banco Depositado</label>
            <input type="number" step="0.01" inputmode="decimal" id="bancoDepositado" class="form-control" value="" min="0" placeholder="0.00" />
          </div>
          <div class="form-group">
            <label for="tipoRetiro">Tipo de retiro</label>
            <select id="tipoRetiro" class="form-control">
              <option value="ninguno">Sin retiro</option>
              <option value="tienda">Tienda</option>
              <option value="banco">Banco</option>
              <option value="ambos">Banco y tienda</option>
            </select>
          </div>
          <div class="form-group">
            <label class="expense-label" for="retiroTienda">Retiro Tienda</label>
            <input type="number" step="0.01" inputmode="decimal" id="retiroTienda" class="form-control" value="" min="0" placeholder="0.00" />
          </div>
          <div class="form-group">
            <label class="expense-label" for="retiroBanco">Retiro Banco</label>
            <input type="number" step="0.01" inputmode="decimal" id="retiroBanco" class="form-control" value="" min="0" placeholder="0.00" />
          </div>
          <div class="form-group">
            <label for="motivoRetiro">Motivo del retiro</label>
            <input type="text" id="motivoRetiro" class="form-control" placeholder="Ej. Pago de inversión" />
          </div>
          <div class="form-group">
            <label for="destinoRetiro">Destino del retiro</label>
            <input type="text" id="destinoRetiro" class="form-control" placeholder="Ej. Banco / proveedor / caja" />
          </div>
          <div class="form-group">
            <label for="comentarioRetiro">Comentario extra</label>
            <textarea id="comentarioRetiro" class="form-control" rows="3" placeholder="Detalles adicionales del retiro"></textarea>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <button type="button" id="cancelModal" class="btn btn-secondary">Cancelar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="/shared/js/config.js"></script>
  <script src="/shared/js/data/offline-store.js"></script>
  <script src="/shared/js/data/data-service.js"></script>
  <script src="/shared/js/request-cache.js"></script>
  <script src="/shared/js/offline-status.js"></script>
  <script src="/shared/js/pwa-register.js"></script>
  <script type="module" src="/modules/tienda/js/tienda.js"></script>
</body>
</html>
