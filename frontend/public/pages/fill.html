<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rellenar Datos - Diario</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.4/css/all.min.css">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/messages.css">
</head>
<body class="app-body">
  <div class="app-shell">
    <aside class="app-sidebar">
      <div class="app-sidebar__brand">
        <strong>Taller Tech</strong>
        <span>Gestión operativa</span>
      </div>
      <div class="app-sidebar__user" id="shellUserInfo"></div>
      <nav class="app-sidebar__nav" id="appSidebarNav"></nav>
      <div class="app-sidebar__footer">
        <button id="appLogoutBtn" class="app-button app-button-ghost app-button-block">
          <i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión
        </button>
      </div>
    </aside>

    <div class="app-content">
      <header class="app-topbar">
        <div>
          <p class="app-topbar__eyebrow">Operación</p>
          <h1>Rellenar entrada</h1>
        </div>
        <div class="app-topbar__actions">
          <span class="app-badge"><i class="fa-solid fa-pen-to-square"></i> Diario</span>
        </div>
      </header>

      <main class="app-main">
        <section class="card shadow-sm mb-4">
          <div class="card-body">
            <div class="d-flex flex-column flex-md-row justify-content-between gap-3 align-items-start align-items-md-center">
              <div>
                <h2 class="h4">Rellenar entrada</h2>
                <p class="text-muted mb-0">Edita o agrega un día y guarda la información directamente en el archivo JSON.</p>
              </div>
              <button id="backupJsonBtn" type="button" class="btn btn-success btn-sm">
                <i class="fas fa-download"></i> Exportar backup JSON
              </button>
            </div>
          </div>
        </section>

        <section class="card shadow-sm mb-4">
          <div class="card-body">
            <form id="diaryForm" class="row g-3">
              <div class="col-md-4">
                <label class="form-label">Año</label>
                <input type="number" id="year" class="form-control" required placeholder="2026">
              </div>
              <div class="col-md-4">
                <label class="form-label">Mes</label>
                <input type="number" id="month" min="1" max="12" class="form-control" required placeholder="1-12">
              </div>
              <div class="col-md-4">
                <label class="form-label">Día</label>
                <input type="number" id="day" min="1" max="31" class="form-control" required placeholder="1-31">
              </div>

              <div class="col-md-6">
                <div class="card border-secondary mb-3">
                  <div class="card-header bg-secondary text-white">ST1</div>
                  <div class="card-body row g-3">
                    <div class="col-6">
                      <label class="form-label">Efectivo</label>
                      <input type="number" step="0.01" id="st1_cash" class="form-control" value="0">
                    </div>
                    <div class="col-6">
                      <label class="form-label">Yape</label>
                      <input type="number" step="0.01" id="st1_yape" class="form-control" value="0">
                    </div>
                  </div>
                </div>
              </div>

              <div class="col-md-6">
                <div class="card border-info mb-3">
                  <div class="card-header bg-info text-white">ST2</div>
                  <div class="card-body row g-3">
                    <div class="col-6">
                      <label class="form-label">Efectivo</label>
                      <input type="number" step="0.01" id="st2_cash" class="form-control" value="0">
                    </div>
                    <div class="col-6">
                      <label class="form-label">Yape</label>
                      <input type="number" step="0.01" id="st2_yape" class="form-control" value="0">
                    </div>
                  </div>
                </div>
              </div>

              <div class="col-12 d-flex flex-wrap gap-2">
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Guardar entrada</button>
                <button type="button" id="deleteDayButton" class="btn btn-danger d-none"><i class="fas fa-trash"></i> Eliminar día</button>
                <button type="button" id="fetchRaw" class="btn btn-outline-secondary"><i class="fas fa-code"></i> Mostrar JSON crudo</button>
              </div>
            </form>
          </div>
        </section>

        <section class="card shadow-sm">
          <div class="card-header">
            <h3 class="h5 mb-0">JSON crudo</h3>
          </div>
          <div class="card-body">
            <pre id="rawJson" class="p-3 bg-light rounded" style="max-height: 420px; overflow:auto;"></pre>
          </div>
        </section>
      </main>
    </div>
  </div>

  <div id="toast" class="app-toast"></div>

  <script src="/js/config.js"></script>
  <script src="/js/app-shell.js"></script>
  <script src="/js/messages.js"></script>
  <script type="module" src="/js/fill.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
